<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Text Content - Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .container {
    width: 100%;
    max-width: 600px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }

  h2 {
    font-size: 18px;
    color: #333;
    margin-bottom: 16px;
  }

  .editor-wrap {
    position: relative;
  }

  .highlight-layer {
    position: absolute;
    top: 9px;
    left: 1px;
    right: 1px;
    pointer-events: none;
    overflow: hidden;
  }

  .highlight-line {
    height: 24px;
    border-radius: 3px;
    margin: 0 4px;
  }

  .highlight-line.dup {
    background: rgba(255, 77, 79, 0.15);
  }

  .editor-wrap textarea {
    width: 100%;
    min-height: 240px;
    padding: 8px 12px 8px 62px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: "Consolas", "Courier New", monospace;
    line-height: 24px;
    resize: vertical;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
    background: transparent;
    position: relative;
    z-index: 1;
  }

  .editor-wrap textarea:focus {
    outline: none;
    border-color: #4a90d9;
    box-shadow: 0 0 0 2px rgba(74,144,217,0.15);
  }

  .btn-layer {
    position: absolute;
    top: 9px;
    left: 9px;
    pointer-events: none;
    z-index: 2;
  }

  .gutter-row {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 24px;
  }

  .gutter-row.dup .line-num {
    color: #ff4d4f;
    font-weight: bold;
  }

  .btn-delete {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 50%;
    color: #bbb;
    font-size: 11px;
    cursor: pointer;
    pointer-events: all;
    transition: all 0.12s;
    line-height: 1;
  }

  .btn-delete:hover {
    background: #ff4d4f;
    border-color: #ff4d4f;
    color: #fff;
  }

  .line-num {
    flex-shrink: 0;
    width: 22px;
    text-align: right;
    font-size: 11px;
    color: #b0b0b0;
    font-family: "Consolas", "Courier New", monospace;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Import Text Content</h2>

  <div class="editor-wrap">
    <div class="highlight-layer" id="highlight_layer"></div>
    <textarea id="input_box" placeholder="在此输入或粘贴文本，每行一条内容…"></textarea>
    <div class="btn-layer" id="btn_layer"></div>
  </div>
</div>

<script>
  const textarea = document.getElementById('input_box');
  const btn_layer = document.getElementById('btn_layer');
  const highlight_layer = document.getElementById('highlight_layer');

  function find_dup_indices(lines) {
    const count_map = {};
    lines.forEach((text) => {
      const trimmed = text.trim();
      if (trimmed.length === 0) return;
      count_map[trimmed] = (count_map[trimmed] || 0) + 1;
    });
    const dup_set = new Set();
    lines.forEach((text, idx) => {
      const trimmed = text.trim();
      if (trimmed.length > 0 && count_map[trimmed] > 1) {
        dup_set.add(idx);
      }
    });
    return dup_set;
  }

  function render() {
    const lines = textarea.value.split('\n');
    const dups = find_dup_indices(lines);

    btn_layer.innerHTML = lines.map((_, idx) => {
      const dup_cls = dups.has(idx) ? ' dup' : '';
      return `<div class="gutter-row${dup_cls}">
        <button class="btn-delete" onmousedown="delete_line(event, ${idx})" title="删除第${idx + 1}行">×</button>
        <span class="line-num">${idx + 1}</span>
      </div>`;
    }).join('');

    highlight_layer.innerHTML = lines.map((_, idx) => {
      const dup_cls = dups.has(idx) ? ' dup' : '';
      return `<div class="highlight-line${dup_cls}"></div>`;
    }).join('');
  }

  function delete_line(e, idx) {
    e.preventDefault();
    const lines = textarea.value.split('\n');
    lines.splice(idx, 1);
    textarea.value = lines.join('\n');
    render();
    textarea.focus();
  }

  textarea.addEventListener('input', render);
  textarea.addEventListener('scroll', () => {
    const offset = -textarea.scrollTop;
    btn_layer.style.top = (9 + offset) + 'px';
    highlight_layer.style.top = (9 + offset) + 'px';
  });

  render();
</script>

</body>
</html>
